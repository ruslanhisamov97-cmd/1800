<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;background:#111;color:#fff;display:grid;place-items:center}
#app{min-height:100vh;width:100%;display:grid;place-items:center;padding:24px;background:#111}
.screen{text-align:center;width:min(600px,100%)}
button{border:0;border-radius:18px;padding:20px 52px;font-size:28px;font-weight:800;background:#fff;color:#111;cursor:pointer}
button:active{transform:scale(.97)}
.warning{font-size:clamp(38px,9vw,78px);line-height:1.02;font-weight:1000;letter-spacing:-2px}
.fake-notifications{position:fixed;right:12px;top:12px;width:min(340px,calc(100vw - 24px));display:grid;gap:8px;pointer-events:none}
.note{background:#222;border:1px solid #444;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px #0008;font-size:14px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
 <main class="screen" id="screen1"><button id="play">ИГРАТЬ</button></main>
 <main class="screen" id="screen2" hidden><div class="warning">ВЕРНИ 1800 РУБЛЕЙ ЗА ДИНОЗАРА</div></main>
</div>
<div class="fake-notifications" id="notes"></div>
<script>
const play=document.getElementById('play'),s1=document.getElementById('screen1'),s2=document.getElementById('screen2'),notes=document.getElementById('notes');
play.onclick=async()=>{
 s1.hidden=true;s2.hidden=false;
 // Системные уведомления требуют разрешения браузера и могут быть ограничены самим браузером.
 if('Notification' in window){try{
   if(Notification.permission==='default') await Notification.requestPermission();
   if(Notification.permission==='granted') for(let i=1;i<=100;i++) setTimeout(()=>{
     try{new Notification('Игра',{body:'ВЕРНИ 1800 РУБЛЕЙ ЗА ДИНОЗАРА'});}catch(e){}
   },i*120);
 }catch(e){}}
 // Встроенная имитация 100 уведомлений работает всегда.
 for(let i=1;i<=100;i++) setTimeout(()=>{
   const n=document.createElement('div');n.className='note';n.textContent='🔔 ВЕРНИ 1800 РУБЛЕЙ ЗА ДИНОЗАРА';notes.prepend(n);
   while(notes.children.length>6)notes.lastElementChild.remove();
 },i*120);
};
</script>
</body>
</html>
